name: File-tree installer packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the private GitHub Packages npm packages after packing
        required: true
        default: false
        type: boolean
      private_version:
        description: Private build revision appended after the bhn identifier
        required: true
        default: '0.1'
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify runner architecture
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.target == 'macos-arm64' && 'arm64' || 'x86_64' }}"
      - name: Build and pack release families
        run: |
          pnpm run release:verify --family dsh
          pnpm run build:official
          pnpm run release:pack --family dsh --out dist/npm
          pnpm run release:pack --family vendor --out dist/npm-vendor
          pnpm --dir native/landlock-run run build:ts
          pnpm --dir native/landlock-run/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"
      - name: Verify workspace upload payload
        shell: bash
        run: |
          set -euo pipefail
          host_tarballs=(dist/npm/deepseek-ai-dsh-host-apiproxy-*.tgz)
          conversation_tarballs=(dist/npm/deepseek-ai-dsh-client-ui-conversation-*.tgz)
          test "${#host_tarballs[@]}" -eq 1
          test "${#conversation_tarballs[@]}" -eq 1
          tar -tzf "${host_tarballs[0]}" | grep -F 'package/lib/types/workspace-upload.js'
          tar -xOzf "${host_tarballs[0]}" package/lib/index.js > "$RUNNER_TEMP/dsh-host-apiproxy.js"
          grep -F 'saveWorkspaceUpload' "$RUNNER_TEMP/dsh-host-apiproxy.js"
          tar -xOzf "${conversation_tarballs[0]}" package/lib/client.js > "$RUNNER_TEMP/dsh-client-ui-conversation.js"
          grep -F 'uploadFiles' "$RUNNER_TEMP/dsh-client-ui-conversation.js"
      - name: Assemble installer staging
        env:
          PRIVATE_VERSION: ${{ inputs.private_version || '0.1' }}
        run: |
          source_version=$(node -p "require('./package.json').version")
          installer_version="${source_version}-bhn.${PRIVATE_VERSION}"
          pnpm run release:assemble-installer --namespace bhnan --version "$installer_version" --source-version "$source_version" --dsh dist/npm --vendor dist/npm-vendor --landlock dist/npm-landlock --out "dist/filetree-installer"
          mkdir -p dist/filetree-tarballs
          if [ "${{ matrix.target }}" = linux-x64 ]; then npm pack dist/filetree-installer/entry --pack-destination dist/filetree-tarballs; fi
          npm pack dist/filetree-installer/${{ matrix.target }} --pack-destination dist/filetree-tarballs
      - name: Verify packed installer
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/filetree-smoke"
          consumer="$RUNNER_TEMP/filetree-consumer"
          mkdir -p "$smoke" "$consumer"
          npm pack dist/filetree-installer/entry --pack-destination "$smoke"
          npm pack dist/filetree-installer/${{ matrix.target }} --pack-destination "$smoke"
          entry_tarballs=("$smoke"/bhnan-dsh-filetree-[0-9]*.tgz)
          platform_tarballs=("$smoke"/bhnan-dsh-filetree-${{ matrix.target }}-*.tgz)
          test "${#entry_tarballs[@]}" -eq 1
          test "${#platform_tarballs[@]}" -eq 1
          npm install --prefix "$consumer" "${entry_tarballs[0]}" "${platform_tarballs[0]}" --no-audit --no-fund
          "$consumer/node_modules/@bhnan/dsh-filetree/bin/dsh.mjs" --version
          "$consumer/node_modules/@bhnan/dsh-filetree-${{ matrix.target }}/bin/dsh.mjs" --help
          "$consumer/node_modules/.bin/dsh" --help
      - uses: actions/upload-artifact@v4
        with:
          name: filetree-${{ matrix.target }}
          path: dist/filetree-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish private GitHub Packages
    needs: pack
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: filetree-*
          path: dist/filetree-tarballs
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: '@bhnan'
      - name: Publish entry and platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tarball in dist/filetree-tarballs/*.tgz; do
            npm publish --access restricted --tag bhn --registry https://npm.pkg.github.com "$tarball"
          done
